name: Clipswain
options:
  bundleIdPrefix: space.icework
  deploymentTarget:
    iOS: '17.0'
  developmentLanguage: en
  xcodeVersion: '26.0'
  groupSortPosition: top
packages:
  PaperclipKit:
    path: PaperclipKit
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  Clipswain:
    type: application
    platform: iOS
    sources:
      - App
      - Resources/Assets.xcassets
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: PaperclipKit
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: Clipswain
        CFBundleLocalizations: [en, zh-Hans]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSLocalNetworkUsageDescription: Connect to the Paperclip server you configure to read tasks and agents.
        NSAppTransportSecurity:
          # Self-hosted Paperclip servers usually run over plain HTTP on an IP address
          # (LAN or tailnet). NSAllowsLocalNetworking alone does not cover IP literals, and
          # its presence would make iOS ignore NSAllowsArbitraryLoads, so only this key is set.
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [fetch]
        CFBundleURLTypes:
          - CFBundleURLName: space.icework.clipswain
            CFBundleURLSchemes: [clipswain]
        BGTaskSchedulerPermittedIdentifiers: [space.icework.clipswain.refresh]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_IDENTIFIER)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: $(CODE_SIGN_STYLE)
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    scheme:
      testTargets:
        - package: PaperclipKit/PaperclipKitTests
        - name: ClipswainAppTests
  ClipswainAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AppTests
    dependencies:
      - target: Clipswain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: space.icework.clipswain.tests
        GENERATE_INFOPLIST_FILE: YES
